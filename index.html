<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Tính Tiền Đơn Giản</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #007bff; color: white; }
        input[type="number"] { width: 60px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; }
        .total-section { margin-top: 20px; text-align: right; font-size: 1.2em; font-weight: bold; color: #d9534f; }
        .btn-calc { display: block; width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; margin-top: 10px; }
        .btn-calc:hover { background: #218838; }
    </style>
</head>
<body>

<div class="container">
    <h2>🛒 Hóa Đơn Thanh Toán</h2>
    
    <table>
        <thead>
            <tr>
                <th>Sản phẩm</th>
                <th>Giá (VNĐ)</th>
                <th>Số lượng</th>
                <th>Thành tiền</th>
            </tr>
        </thead>
        <tbody id="product-list">
            <tr class="item">
                <td>Cà phê đá</td>
                <td class="price" data-value="25000">25,000</td>
                <td><input type="number" class="qty" value="0" min="0" oninput="calculate()"></td>
                <td class="subtotal">0</td>
            </tr>
            <tr class="item">
                <td>Bánh mì thịt</td>
                <td class="price" data-value="30000">30,000</td>
                <td><input type="number" class="qty" value="0" min="0" oninput="calculate()"></td>
                <td class="subtotal">0</td>
            </tr>
            <tr class="item">
                <td>Trà sữa trân châu</td>
                <td class="price" data-value="45000">45,000</td>
                <td><input type="number" class="qty" value="0" min="0" oninput="calculate()"></td>
                <td class="subtotal">0</td>
            </tr>
        </tbody>
    </table>

    <div class="total-section">
        Tổng cộng: <span id="grand-total">0</span> VNĐ
    </div>
    
    <button class="btn-calc" onclick="alert('Cảm ơn bạn đã mua hàng!')">Thanh toán</button>
</div>

<script>
    function calculate() {
        let items = document.querySelectorAll('.item');
        let grandTotal = 0;

        items.forEach(item => {
            let price = parseInt(item.querySelector('.price').getAttribute('data-value'));
            let qty = parseInt(item.querySelector('.qty').value) || 0;
            let subtotal = price * qty;
            
            item.querySelector('.subtotal').innerText = subtotal.toLocaleString();
            grandTotal += subtotal;
        });

        document.getElementById('grand-total').innerText = grandTotal.toLocaleString();
    }
</script>

</body>
</html>
