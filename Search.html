<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Search</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f8;--fg:#14213d;--mut:#5b6785;--card:#fff;--line:#d3daea;--acc:#2f5bff;--onacc:#fff;--warn:#c92a4b;--chip:#e3e9ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--fg:#eaf0ff;--mut:#98a4c4;--card:#18203a;--line:#2c3759;--acc:#7c98ff;--onacc:#0e1424;--warn:#ff8da4;--chip:#222d52}}
:root[data-theme="dark"]{--bg:#0e1424;--fg:#eaf0ff;--mut:#98a4c4;--card:#18203a;--line:#2c3759;--acc:#7c98ff;--onacc:#0e1424;--warn:#ff8da4;--chip:#222d52}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:14vh 20px 40px}
h1{font:800 clamp(3rem,13vw,5.5rem)/1 Unbounded,"Arial Black",Impact,sans-serif;letter-spacing:-.04em;text-align:center;margin:0 0 2.2rem}
h1 span{color:var(--acc)}
.box{display:flex;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:8px}
.box:focus-within{border-color:var(--acc)}
input[type=text]{flex:1;min-width:0;border:0;background:none;color:inherit;font:inherit;font-size:1.15rem;padding:10px 12px;outline:0}
button{border:0;border-radius:12px;background:var(--acc);color:var(--onacc);font:inherit;font-weight:700;padding:0 22px;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.opts{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;margin:16px 4px 0;color:var(--mut);font-size:.95rem}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;color:var(--fg)}
.sw input{position:absolute;opacity:0}
.sw i{width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked+i{background:var(--acc)}
.sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:2px solid var(--acc);outline-offset:2px}
select{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;font:inherit;padding:5px 10px}
#cnt{margin-left:auto}
#cnt.over{color:var(--warn);font-weight:600}
#out{margin-top:28px}
#out[hidden]{display:none}
#map{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
#map span{background:var(--chip);border-radius:10px;padding:3px 12px 3px 4px;display:flex;align-items:center;gap:8px;max-width:100%;overflow-wrap:anywhere}
#map b{font:800 .75rem Unbounded,sans-serif;background:var(--acc);color:var(--onacc);border-radius:7px;padding:4px 7px}
code{display:block;font:.9rem/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--mut);overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>Search<span>.</span></h1>
  <div class="box">
    <input type="text" id="q" placeholder="Type something to search…" autocomplete="off" autofocus aria-label="Search words">
    <button id="go">Search</button>
  </div>
  <div class="opts">
    <label class="sw"><input type="checkbox" id="tab" checked><i></i><span id="tl">New tab</span></label>
    <select id="eng" aria-label="Search engine">
      <option value="https://www.google.com/search?q=">Google</option>
      <option value="https://www.bing.com/search?q=">Bing</option>
    </select>
    <span id="cnt">0 of 32 words</span>
  </div>
  <div id="out" hidden><div id="map"></div><code id="url"></code></div>
</main>
<script>
const $=s=>document.getElementById(s),MAX=32;
const lab=i=>(i>25?String.fromCharCode(64+i/26|0):"")+String.fromCharCode(65+i%26); // A..Z, AA, AB…
const words=()=>$("q").value.trim().split(/\s+/).filter(Boolean);
const link=w=>$("eng").value+w.map(encodeURIComponent).join("+");
try{const s=JSON.parse(localStorage.getItem("sx")||"{}");if("t"in s)$("tab").checked=s.t;if(s.e)$("eng").value=s.e}catch(e){}
function render(){
  const all=words(),w=all.slice(0,MAX);
  $("tl").textContent=$("tab").checked?"New tab":"Same tab";
  $("cnt").textContent=all.length>MAX?`${all.length} of ${MAX} words (extra ignored)`:`${all.length} of ${MAX} words`;
  $("cnt").classList.toggle("over",all.length>MAX);
  $("out").hidden=!w.length;
  $("url").textContent=link(w);
  $("map").replaceChildren(...w.map((x,i)=>{const s=document.createElement("span"),b=document.createElement("b");b.textContent=lab(i);s.append(b,x);return s}));
  try{localStorage.setItem("sx",JSON.stringify({t:$("tab").checked,e:$("eng").value}))}catch(e){}
}
function go(){
  const w=words().slice(0,MAX);if(!w.length)return;
  const a=document.createElement("a");a.href=link(w);a.target=$("tab").checked?"_blank":"_top";a.rel="noopener noreferrer";a.click();
}
["input","change"].forEach(t=>document.addEventListener(t,render));
$("go").onclick=go;
$("q").onkeydown=e=>{if(e.key==="Enter")go()};
render();
</script>
</body>
</html>
